<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Sudoku</h1>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">
      <span class="theme-icon" aria-hidden="true">&#9728;</span>
    </button>
  </header>

  <main class="game-container">
    <aside class="controls-left">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty" aria-label="Select puzzle difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game" class="btn btn-primary">New Game</button>
    </aside>

    <section class="board-section" aria-label="Sudoku board">
      <div id="sudoku-board" role="grid" aria-label="Sudoku puzzle grid"></div>
      <p id="timer" class="timer" aria-live="polite">Time: 0:00</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <aside class="controls-right">
      <button id="check-solution" class="btn btn-secondary">Check</button>
      <button id="hint-btn" class="btn btn-hint">Hint</button>
    </aside>
  </main>

  <section class="leaderboard-section" aria-label="Top 10 fastest times">
    <h2>Top 10 Fastest Times:</h2>
    <table id="leaderboard" class="leaderboard">
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Level</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
      </tbody>
    </table>
  </section>

  <!-- Completion modal -->
  <div id="completion-modal" class="modal hidden" role="dialog" aria-labelledby="modal-title" aria-modal="true">
    <div class="modal-content">
      <h2 id="modal-title">Congratulations!</h2>
      <p id="modal-message"></p>
      <label for="player-name">Enter your name for the leaderboard:</label>
      <input type="text" id="player-name" maxlength="20" placeholder="Your name" aria-label="Player name">
      <div class="modal-actions">
        <button id="save-score" class="btn btn-primary">Save Score</button>
        <button id="close-modal" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
